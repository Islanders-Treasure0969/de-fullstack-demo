# Phase 0 platform stack — minimum services to bring up the local data plane.
# Add streaming services via docker-compose.streaming.yml.

name: de-lab

networks:
  de-lab:
    driver: bridge

volumes:
  garage-meta:
  garage-data:
  postgres-data:
  lakekeeper-pg-data:
  temporal-pg-data:

services:
  # ----------------------------------------------------------------
  # LocalStack — AWS API emulation (S3, Glue, IAM, Secrets, etc.)
  # ----------------------------------------------------------------
  localstack:
    image: localstack/localstack:4.14@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,iam,glue,secretsmanager,sts,kms
      AWS_DEFAULT_REGION: ap-northeast-1
      DEBUG: "0"
      PERSISTENCE: "1"
    volumes:
      - "./data/localstack:/var/lib/localstack"
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------
  # Garage — S3-compatible object store (replaces dead MinIO)
  # ----------------------------------------------------------------
  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    ports:
      - "3900:3900"  # S3 API
      - "3903:3903"  # admin API
    environment:
      # Secrets injected from 1Password via `op run --env-file=.env`.
      # Garage reads any config field from env when prefixed with GARAGE_.
      # See: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET must be set (use op run --env-file=.env -- ...)}"
      GARAGE_ADMIN_TOKEN: "${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN must be set}"
      GARAGE_METRICS_TOKEN: "${GARAGE_ADMIN_TOKEN:?reuse admin token for metrics}"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - "./garage/garage.toml:/etc/garage.toml:ro"
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3903/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------
  # Lakekeeper — Iceberg REST catalog (Apache 2.0, Rust)
  # ----------------------------------------------------------------
  lakekeeper-db:
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    volumes:
      - lakekeeper-pg-data:/var/lib/postgresql/data
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot DB schema migrator. Runs `lakekeeper migrate` and exits 0.
  # The serve container depends on this completing successfully.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.12.1@sha256:7f6be079a9bc80e4223a5faf58738e248edfbf4244096e7e05447980af74cabb
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgres://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgres://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper"
      RUST_LOG: info
    command: ["migrate"]
    restart: "no"
    networks: [de-lab]

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.12.1@sha256:7f6be079a9bc80e4223a5faf58738e248edfbf4244096e7e05447980af74cabb
    depends_on:
      lakekeeper-db:
        condition: service_healthy
      lakekeeper-migrate:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgres://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgres://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper"
      LAKEKEEPER__BASE_URI: "http://localhost:8181"
      RUST_LOG: info
    command: ["serve"]
    networks: [de-lab]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ----------------------------------------------------------------
  # Postgres — operational mart (reverse-ETL target, app DB)
  # ----------------------------------------------------------------
  postgres:
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-de_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de_lab_dev}
      POSTGRES_DB: ${POSTGRES_DB:-de_lab}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de_lab}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------
  # Temporal — orchestration
  # ----------------------------------------------------------------
  temporal-db:
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29@sha256:1263120feed69d82e4ca23b8ca6f1d702c3029fe70714e382966d0192318eab6
    depends_on:
      temporal-db:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.49.1@sha256:a066bdf5c4de689cabaf80cc357871f1db5e6d750a6bcfc42e877b913e31ef24
    depends_on:
      temporal:
        condition: service_started
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    networks: [de-lab]
