# Phase 0 platform stack — minimum services to bring up the local data plane.
# Add streaming services via docker-compose.streaming.yml.

name: de-lab

networks:
  de-lab:
    driver: bridge

volumes:
  garage-meta:
  garage-data:
  postgres-data:
  lakekeeper-pg-data:
  temporal-pg-data:

services:
  # ----------------------------------------------------------------
  # LocalStack — AWS API emulation (S3, Glue, IAM, Secrets, etc.)
  # ----------------------------------------------------------------
  localstack:
    image: localstack/localstack:4.14@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,iam,glue,secretsmanager,sts,kms
      AWS_DEFAULT_REGION: ap-northeast-1
      DEBUG: "0"
      PERSISTENCE: "1"
    volumes:
      - "./data/localstack:/var/lib/localstack"
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------
  # Garage — S3-compatible object store (replaces dead MinIO)
  # ----------------------------------------------------------------
  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    ports:
      - "3900:3900"  # S3 API
      - "3903:3903"  # admin API
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - "./garage/garage.toml:/etc/garage.toml:ro"
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3903/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------
  # Lakekeeper — Iceberg REST catalog (Apache 2.0, Rust)
  # ----------------------------------------------------------------
  lakekeeper-db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    volumes:
      - lakekeeper-pg-data:/var/lib/postgresql/data
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper"]
      interval: 10s
      timeout: 5s
      retries: 10

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.3@sha256:db2ba6168eb107f22242fb7f2edc4016fa35e57bdcc606894e809c418e32e8dc
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgres://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgres://lakekeeper:lakekeeper@lakekeeper-db:5432/lakekeeper"
      LAKEKEEPER__BASE_URI: "http://localhost:8181"
      RUST_LOG: info
    command: ["serve"]
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ----------------------------------------------------------------
  # Postgres — operational mart (reverse-ETL target, app DB)
  # ----------------------------------------------------------------
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-de_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de_lab_dev}
      POSTGRES_DB: ${POSTGRES_DB:-de_lab}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de_lab}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------
  # Temporal — orchestration
  # ----------------------------------------------------------------
  temporal-db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    depends_on:
      temporal-db:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    networks: [de-lab]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.53.3@sha256:eef301146e60fad34b47adaecfae4149016e34b2d44ba94fca5fd8e5441f182a
    depends_on:
      temporal:
        condition: service_started
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    networks: [de-lab]
