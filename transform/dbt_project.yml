name: de_lab
version: "0.1.0"
config-version: 2

profile: de_lab

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

models:
  de_lab:
    bronze:
      # Materialize bronze as table (not view) to dodge DuckDB v1.5 binder
      # bug: view → silver `qualify` with multiple TIMESTAMP columns triggers
      # "INTERNAL Error: TIMESTAMP != VARCHAR". Persisted bronze has stable
      # column types and avoids the inline-view binder path.
      +materialized: table
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

vars:
  github_target_repos: []
