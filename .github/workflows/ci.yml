name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      tofu: ${{ steps.filter.outputs.tofu }}
      dbt: ${{ steps.filter.outputs.dbt }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            python:
              - 'dashboard/**'
              - 'webapp/api/**'
              - 'ingestion/**/*.py'
              - 'pyproject.toml'
              - '**/requirements*.txt'
            go:
              - 'ingestion/go/**'
              - 'orchestration/**/*.go'
              - '**/go.mod'
            rust:
              - 'ingestion/rust/**'
              - '**/Cargo.toml'
            web:
              - 'webapp/front/**'
              - '**/package.json'
            tofu:
              - 'infra/**'
            dbt:
              - 'transform/**'
            compose:
              - 'docker/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.22"
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

  tofu:
    needs: changes
    if: needs.changes.outputs.tofu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2
        with:
          tofu_version: "1.8.5"
      - name: tofu fmt check
        run: tofu fmt -check -recursive infra/

  dbt:
    needs: changes
    if: needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: dbt parse
        working-directory: transform
        run: |
          pip install dbt-core dbt-duckdb
          dbt deps || true
          dbt parse || true   # tolerate during skeleton phase

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: docker compose config
        working-directory: docker
        run: docker compose config --quiet

  ci-success:
    name: ci
    needs: [changes, python, go, rust, web, tofu, dbt, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          for r in '${{ needs.python.result }}' '${{ needs.go.result }}' '${{ needs.rust.result }}' '${{ needs.web.result }}' '${{ needs.tofu.result }}' '${{ needs.dbt.result }}' '${{ needs.compose.result }}'; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "Job result: $r — failing"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
