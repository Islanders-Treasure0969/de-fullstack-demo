name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"  # Mondays 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript is added in Phase 5 when webapp/front/ ships real code.
        # CodeQL aborts when no source files exist; do not enable until then.
        language: [python, go]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: github/codeql-action/init@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3
      - uses: github/codeql-action/analyze@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3
        with:
          category: "/language:${{ matrix.language }}"

  gate:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify analyze matrix passed
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ]; then
            echo "analyze result: ${{ needs.analyze.result }} — failing"
            exit 1
          fi
