name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 0"  # weekly Sunday 06:00 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify scan passed
        run: |
          if [ "${{ needs.scan.result }}" != "success" ]; then
            echo "scan result: ${{ needs.scan.result }} — failing"
            exit 1
          fi
